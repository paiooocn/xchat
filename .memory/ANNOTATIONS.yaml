# .memory/ANNOTATIONS.yaml — 手写判断层
#
# 与 MAP.yaml 的分工：
#   MAP.yaml       = 机器扫描出的事实：文件、顶层符号、模块依赖、测试清单（生成，勿手改）
#   本文件         = 人的判断：模块职责、改动风险、功能→文件映射、设计文档引用
#
# 三条规矩：
#   1. 一个事实只存一处 —— 代码在哪在 MAP.yaml，为什么这么做在 DESIGN.md，坑在 GOTCHAS.md
#   2. 不复制 DESIGN.md 的段落，只写章节号引用
#   3. 引用不用行号，只用 路径 + 符号名
#
# 维护时机：
#   - 新增/删除/移动文件，或模块职责变化 → 改本文件 + 跑生成器刷新 MAP.yaml
#   - 某功能的文件集合变化 → 改 features[].files（这是本文件最有价值的部分）

meta:
  updated_at: "2026-10-28"
  git_sha: "e7712e6"
  app_version: "0.5.7"

risk_levels:
  high: "破坏持久化格式、协议兼容或安全边界 —— 动手前必读 GOTCHAS.md 对应条目 + DESIGN.md 章节"
  mid: "跨模块或跨平台 —— 动手前读 ARCHITECTURE.md 的跨层契约"
  low: "局部改动，影响面小"

modules:
  app:
    role: "进程入口与 MaterialApp 外壳（Provider 注入、主题、边到边安全区处理）"
    risk: low
    note: "runApp 之前不能抛异常，否则 App 启动即崩；AppPaths 内部已做降级处理"
    design: "DESIGN.md §12"

  core:
    role: "基础设施层：数据目录解析、版本号、ID、JSON 容错、Python 运行时定位与注入、窗口尺寸、pip 包存储、提示词组装、项目记忆协议文本与骨架模板"
    risk: mid
    note: "Python 注入只前置 PATH 不覆盖；Windows 需补 python3.exe 别名；app_paths 解析失败必须降级而不是抛；memory_protocol.dart 的注入块是协议正文的唯一副本（PROMPT.md 骨架里引用它）"
    design: "docs/PYTHON_RUNTIME_PLAN.md"

  models:
    role: "纯数据模型（不依赖 Flutter）：会话、消息、配置、provider、模板、项目、token 用量"
    risk: mid
    note: "新增字段必须同步 lib/data/xml 的编解码，否则旧会话读不出来"
    design: "DESIGN.md §5"

  data:
    role: "仓库层：会话/模板/配置/项目/索引/models.dev/项目记忆索引的读写与原子落盘"
    risk: high
    note: "index.json 只是缓存，必须能与磁盘自愈；写路径不能每次全量重建目录；MemoryRepository.ensureSkeleton 只补缺失文件，绝不覆盖 agent 已写的内容"
    design: "DESIGN.md §4"

  data.xml:
    role: "会话/模板/项目的 XML 编解码（手写 CDATA writer，不用通用 pretty printer）"
    risk: high
    note: "通用 formatter 会往 CDATA 注入空白破坏往返；CDATA 里的 ]]> 必须拆分"
    design: "DESIGN.md §6"

  llm:
    role: "provider 工厂、思考内容回发适配、会话压缩/命名、提示词助手"
    risk: high
    note: "思考回发同时支持 reasoning_content 与 <think> 两种模式；出站前必须修复 tool 调用协议"
    design: "DESIGN.md §7"

  agent:
    role: "ReAct 引擎：模型→工具→模型，带工具次数预算与自动续判"
    risk: high
    note: "预算用尽后追加一条 user 消息让模型自判是否继续；图片附件在引擎侧二次校验，不信任工具返回值"
    design: "DESIGN.md §9"

  agent.tools:
    role: "内置工具实现（文件/搜索/shell/图片）、沙箱路径守卫、WebView 页面提取"
    risk: high
    note: "路径守卫是安全边界；shell 命令分级由 shell_policy 决定，改动会影响审批流程"
    design: "DESIGN.md §10"

  session:
    role: "会话运行时控制器与纯会话操作（编辑重发、克隆、归档）"
    risk: mid
    note: "controller 生命周期长于聊天面板，切换会话不能中断正在跑的 turn"
    design: "DESIGN.md §11"

  state:
    role: "全局 AppState（会话列表/模板/项目/配置）与跨会话工具审批队列"
    risk: mid
    note: "列表只存元数据，消息按需加载进 _sessionCache，重新列举不会丢掉已打开会话的消息"
    design: "FEATURES.md §7"

  ui.pages:
    role: "全部页面：首页聊天、会话/模板向导、provider、设置、工具、搜索、归档、pip 包、XML 编辑器"
    risk: mid
    note: "home_page.dart 近 3000 行，改动前先 grep 定位，别整页重写"
    design: "FEATURES.md §9.1"

  ui.widgets:
    role: "复用组件：消息气泡、输入区、Markdown/公式渲染、思考块、工具调用块、usage 徽标、项目新建/编辑对话框"
    risk: low
    note: "复制粘贴换行修复、KaTeX 归一化都在这一层；对话框类 widget 必须自己持有并在 dispose 里释放 TextEditingController —— 在 showDialog 返回后立刻释放会让仍在动画中的对话框抛 'used after being disposed'"
    design: "FEATURES.md §9.2"

  ui.theme:
    role: "主题与字体配置（Noto Sans SC / JetBrains Mono 打包在 assets/fonts）"
    risk: low
    note: "改字重需要重新打包字体资产，不只是改 pubspec"
    design: null

  util:
    role: "外部编辑器/工作目录/URL 启动（桌面端能力）"
    risk: low
    note: "移动端不具备该能力，注意平台分支"
    design: "FEATURES.md §10"

  pkg.llm_api:
    role: "vendor 的 provider 无关 LLM 客户端（流式、工具调用、思考路由、错误分层）"
    risk: high
    note: "独立 package，有自己的 pubspec；改它要同时确认 lib/ 侧适配，尤其思考回发与 tool 协议"
    design: "FEATURES.md §3.1"

features:
  - id: session_storage
    title: "会话 XML 持久化（核心契约）"
    files:
      - "lib/data/xml/session_xml.dart"
      - "lib/data/xml/xml_writer.dart"
      - "lib/data/xml/cdata.dart"
      - "lib/data/session_repository.dart"
      - "lib/models/session.dart"
      - "lib/models/session_message.dart"
    design: "DESIGN.md §6"
    contracts:
      - "根元素 chat，sandbox 属性记录工作目录，文件名为会话 UUID"
      - "正文一律 CDATA，任何缩进/格式化不得注入空白"
      - "新增字段要同时改写与读，且必须能读旧文件"
      - "kind / tasks / task_id 只在任务式会话写；普通会话文件保持原格式（不写 kind、不写 tasks）"

  - id: catalog_index
    title: "目录索引 index.json（列表加速）"
    files:
      - "lib/data/index_repository.dart"
      - "lib/models/catalog_index.dart"
    design: "FEATURES.md §1.5"
    contracts:
      - "索引是缓存，磁盘为准，加载时校验并透明重建"

  - id: task_sessions
    title: "任务式会话（任务项分组 + 按任务显示）"
    files:
      - "lib/models/task_item.dart"
      - "lib/models/session.dart"
      - "lib/models/session_message.dart"
      - "lib/data/xml/session_xml.dart"
      - "lib/session/session_ops.dart"
      - "lib/session/session_controller.dart"
      - "lib/agent/agent_engine.dart"
      - "lib/ui/widgets/task_session_view.dart"
      - "lib/ui/pages/session_wizard_page.dart"
      - "lib/ui/pages/home_page.dart"
    design: "FEATURES.md §1.2 / §7"
    contracts:
      - "task_id 只做显示分组：出站历史始终是整个会话（方案 B），改这里别把过滤带进 buildChatMessages"
      - "一个 turn 内的 user/assistant/tool 消息必须带同一个 task_id（AgentEngine 统一打标）"
      - "SessionOps 的 lastUserIndex/editLastUser/dropLastAssistant 必须按 onlyTaskId 限定范围，否则会删掉别的任务的对话"
      - "一个会话只有一个 SessionController → 任务串行；runningTaskId 用于把流式区绑到对应任务"

  - id: thinking_echo
    title: "思考模式显示与回发"
    files:
      - "lib/llm/outbound_adapter.dart"
      - "lib/models/session_params.dart"
      - "lib/models/session_message.dart"
      - "lib/ui/widgets/thinking_block.dart"
      - "packages/llm_api/lib/src/thinking/reasoning_router.dart"
      - "packages/llm_api/lib/src/thinking/think_tag_parser.dart"
    design: "DESIGN.md §7"
    contracts:
      - "reasoning_content 与 <think> 两种思考内容都要回发给模型"
      - "回发策略：会话显式模式 > provider 默认 > 由预设推导"

  - id: tool_protocol
    title: "工具调用协议修复（出站兜底）"
    files:
      - "lib/llm/outbound_adapter.dart"
      - "packages/llm_api/lib/src/core/tool.dart"
    design: "FEATURES.md §3.2"
    contracts:
      - "assistant 的 tool_calls 必须后接恰好一条对应 tool 消息；缺失补错误占位，孤儿 tool 消息丢弃"

  - id: token_usage
    title: "Token 用量统计与落盘"
    files:
      - "lib/models/token_usage.dart"
      - "packages/llm_api/lib/src/core/usage.dart"
      - "lib/ui/widgets/usage_badge.dart"
    design: "DESIGN.md §8"
    contracts:
      - "单次用量写进 assistant 消息；累计用量写进 system 消息的 input/output/cache 与 context"

  - id: react_budget
    title: "ReAct 主循环、工具次数预算与自动续判"
    files:
      - "lib/agent/agent_engine.dart"
      - "lib/agent/agent_events.dart"
      - "lib/models/app_config.dart"
    design: "DESIGN.md §9.2"
    contracts:
      - "预算用尽后追加一条 user 消息，由模型自判是否继续，continueMode/continuePrompt 可配"

  - id: tool_approval
    title: "工具审批（全局队列）"
    files:
      - "lib/state/approval_center.dart"
      - "lib/models/agent_mode.dart"
      - "lib/agent/agent_engine.dart"
    design: "FEATURES.md §4.3"
    contracts:
      - "审批队列跨会话共享；turn 被停止时待审批必须立即中止，否则会钉住 agent"

  - id: sandbox_guard
    title: "沙箱路径守卫"
    files:
      - "lib/agent/tools/path_guard.dart"
      - "lib/agent/tools/file_ops.dart"
    design: "DESIGN.md §10.2"
    contracts:
      - "resolve 拦 ../ 越界；resolveReal 额外跟随符号链接防软链逃逸"

  - id: shell_tool
    title: "shell 工具：命令分级与可配置启动器"
    files:
      - "lib/models/shell_policy.dart"
      - "lib/models/shell_exec.dart"
      - "lib/agent/tools/builtin_tools.dart"
    design: "FEATURES.md §5.3"
    contracts:
      - "命令字符串映射到审批级别；启动器可配可执行文件与 {command} 模板"

  - id: file_tools
    title: "文件工具：read/write/glob/grep/mv"
    files:
      - "lib/agent/tools/file_ops.dart"
    design: "FEATURES.md §5.1"
    contracts:
      - "read_file 支持读图；glob 过滤按 glob 语法转正则"

  - id: image_attach
    title: "多模态图片附件"
    files:
      - "lib/agent/tools/image_attach.dart"
      - "lib/models/message_attachment.dart"
      - "lib/agent/agent_engine.dart"
    design: "DESIGN.md §10.1.1"
    contracts:
      - "图片复制进会话 sandbox 的 attachments/ 目录，保证会话自包含"
      - "base64 内联传输有大小上限，超限直接丢弃而不是截断"

  - id: web_search
    title: "隐藏 WebView 搜索与页面提取"
    files:
      - "lib/agent/tools/webview_tools.dart"
      - "lib/agent/tools/webview_extractor.dart"
      - "lib/agent/tools/browser_session.dart"
      - "lib/agent/tools/search_filter.dart"
      - "lib/models/search_engine_config.dart"
    design: "DESIGN.md §19"
    contracts:
      - "Linux 构建需 libwebkit2gtk-4.1-dev"
      - "相关度过滤对中文按 bigram 切词，规则改动会影响搜索质量回归"

  - id: script_registry
    title: "页面提取脚本注册表"
    files:
      - "lib/agent/tools/script_registry.dart"
      - "lib/models/extract_script.dart"
      - "assets/scripts/"
    design: "DESIGN.md §19.3"
    contracts:
      - "内置 assets/scripts 与 <root>/scripts/*.json 合并，磁盘优先"

  - id: python_runtime
    title: "内置 Python 运行时与 pip 包管理"
    files:
      - "lib/core/python_runtime.dart"
      - "lib/core/python_packages.dart"
      - "lib/ui/pages/pip_packages_page.dart"
      - "tool/fetch_python.sh"
    design: "docs/PYTHON_RUNTIME_PLAN.md"
    contracts:
      - "解释器优先级：内置 → 系统 PATH → 用户自定义"
      - "PATH 只前置不覆盖；PYTHONPATH 透传；PIP_INDEX_URL 走镜像链"

  - id: providers
    title: "Provider 配置、连通性测试与代理"
    files:
      - "lib/ui/pages/providers_page.dart"
      - "lib/llm/llm_factory.dart"
      - "lib/models/provider_config.dart"
      - "lib/models/proxy_config.dart"
      - "packages/llm_api/lib/src/providers/openai_compatible.dart"
    design: "DESIGN.md §13"
    contracts:
      - "输出上限：ProviderConfig.maxOutputTokens → OpenAiCompatibleConfig.defaultMaxTokens（会话参数 max_tokens 优先）"
      - "按档位的输出上限：ProviderConfig.maxOutputTokensByEffort（规格串 'low:1280/high:3840'）→ ProviderConfig.maxOutputTokensFor(会话 reasoning_effort) → defaultMaxTokens；未命中档位=不限制；配了档位表就取代固定值"
      - "输出上限优先级：会话/模板显式 max_tokens（模板「最大输出 tokens」字段，留空=不显式指定）> 服务按档位/固定值算出的上限"
      - "参数名：useMaxCompletionTokens 决定请求体用 max_completion_tokens 还是 max_tokens"

  - id: models_dev
    title: "models.dev 模型目录同步"
    files:
      - "lib/data/models_dev_repository.dart"
      - "lib/models/models_dev.dart"
      - "assets/models_dev/models_dev.json"
    design: "DESIGN.md §17"
    contracts:
      - "内置快照是离线兜底，一键同步覆盖本地缓存"

  - id: session_templates
    title: "会话模板与创建向导"
    files:
      - "lib/ui/pages/session_wizard_page.dart"
      - "lib/ui/pages/template_wizard_page.dart"
      - "lib/ui/pages/templates_page.dart"
      - "lib/data/template_repository.dart"
      - "lib/data/xml/template_xml.dart"
      - "lib/models/session_template.dart"
    design: "DESIGN.md §11.1"
    contracts: []

  - id: session_ops
    title: "会话操作：编辑重发、克隆、归档、多会话并行"
    files:
      - "lib/session/session_ops.dart"
      - "lib/session/session_controller.dart"
      - "lib/ui/pages/archive_page.dart"
    design: "DESIGN.md §11.4"
    contracts:
      - "克隆只复制到第一个 user 元素为止"
      - "切换会话不 dispose controller，多会话可并行"

  - id: markdown_math
    title: "Markdown 与 KaTeX 公式渲染"
    files:
      - "lib/ui/widgets/markdown_view.dart"
      - "lib/ui/widgets/math_support.dart"
      - "lib/ui/widgets/message_bubble.dart"
    design: "FEATURES.md §9.2"
    contracts:
      - "选中复制后粘贴必须保留换行"

  - id: app_config
    title: "全局配置 config.json"
    files:
      - "lib/models/app_config.dart"
      - "lib/data/config_repository.dart"
      - "lib/ui/pages/settings_page.dart"
    design: "FEATURES.md §8"
    contracts:
      - "AppConfig 是配置 schema，改字段要考虑老配置文件的默认值"

  - id: projects
    title: "项目（projects）与工作目录"
    files:
      - "lib/models/project.dart"
      - "lib/data/project_repository.dart"
      - "lib/data/xml/project_xml.dart"
      - "lib/ui/pages/home_page.dart"
    design: "FEATURES.md §1.3"
    contracts:
      - "Project.systemPrompt 是项目级提示词，在项目编辑面板里写，新建会话页按开关并入"
      - "Project.memoryEnabled 是三态：null=从未设置（老项目，只有 .memory/ 目录存在才按已启用自愈）/ true / false（显式关掉，目录还在也不注入）"

  - id: project_memory
    title: "项目记忆索引（.memory/）"
    files:
      - "lib/core/memory_protocol.dart"
      - "lib/core/prompt_utils.dart"
      - "lib/data/memory_repository.dart"
      - "lib/models/memory_status.dart"
      - "lib/state/app_state.dart"
      - "lib/ui/pages/home_page.dart"
      - "lib/ui/pages/session_wizard_page.dart"
      - "lib/ui/pages/settings_page.dart"
      - "lib/ui/widgets/project_dialog.dart"
    design: "FEATURES.md §7"
    contracts:
      - "索引位于项目工作目录内的 .memory/，随项目走；六个文件 README/STATE/ARCHITECTURE/GOTCHAS/MAP/PROMPT"
      - "骨架写入非破坏：只补缺失文件，不覆盖 agent 已写的内容"
      - "注入点唯一：AppState.createSessionDraft 拼装系统提示词（欢迎页/模板/向导三条路径都经过它）"
      - "注入块自包含（约 200–400 tokens），协议正文在 .memory/README.md §2/§4，只存一份"
      - "注入幂等：协议块以 marker【记忆索引 · .memory/】开头，已有则不追加（压缩会话会重建提示词）"
      - "位置：工作空间根目录行之后一行指针，完整职责在提示词末尾（长提示词下也看得见；收尾义务靠近对话）"
      - "目录索引版本升到 3：老 index.json 缺 memory_enabled 会被重建，否则会静默关掉所有项目的记忆"
      - "补齐入口有三处：项目对话框的单项目补齐、设置页的一键批量补齐、启动时 healProjectMemory 重建被误删的索引"
      - "记忆协议只在 AppState.createSessionDraft 注入一次；向导页只提供开关"

  - id: session_prompts
    title: "会话系统提示词的三段式组装"
    files:
      - "lib/core/prompt_utils.dart"
      - "lib/ui/pages/session_wizard_page.dart"
      - "lib/state/app_state.dart"
    design: "FEATURES.md §7"
    contracts:
      - "顺序固定：会话提示词 / 项目提示词 / 新增提示词，空段丢弃，段间用 \\n---\\n"
      - "工作空间根目录行由 injectWorkspaceRoot 写在最上面"
      - "项目记忆协议在 AppState 层作为独立段追加（向导页的三段式不包含它）"

  - id: external_editor
    title: "外部编辑器 / 工作目录 / URL 打开"
    files:
      - "lib/util/editor_launcher.dart"
      - "lib/ui/pages/xml_editor_page.dart"
    design: "DESIGN.md §11.3"
    contracts: []

  - id: desktop_window
    title: "桌面窗口尺寸与平台差异"
    files:
      - "lib/core/window_prefs.dart"
      - "lib/app.dart"
      - "android/app/build.gradle.kts"
    design: "FEATURES.md §10"
    contracts:
      - "窗口尺寸在首帧后幂等重放 resize；Android 15 边到边用 padding.bottom 而非 viewPadding.bottom"
