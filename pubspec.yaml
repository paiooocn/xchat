name: xchat
description: "XChat - LLM Agent cross-platform GUI with H5 + WebView."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 平台分流:
  #   Android / iOS / macOS  -> webview_flutter(Google 官方,系统 WebView)
  #   Windows / Linux / Web  -> flutter_inappwebview(唯一 6 平台覆盖的非官方包)
  webview_flutter: ^4.14.1
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_platform_interface: ^1.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  crypto: ^3.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  xml: ^7.0.1
  intl: ^0.20.3
  uuid: ^4.5.1
  process_run: ^1.2.1
  file: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/index.html
    - assets/web/css/
    - assets/web/js/
    - assets/web/js/pages/
