name: xchat
description: "XChat - cross-platform LLM agent GUI (ReAct + XML sessions)."
publish_to: 'none'
version: 0.5.6+1
license: MIT

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # LLM client (vendored, provider-agnostic OpenAI-compatible streaming + tools)
  llm_api:
    path: packages/llm_api

  # XML (CDATA support)
  xml: ^6.5.0

  # Paths / storage
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  permission_handler: ^11.3.1

  # Utils
  uuid: ^4.5.1
  http: ^1.2.2
  html: ^0.15.4
  intl: ^0.20.0

  # Multimodal input: pick image files to send to the LLM
  # >=10 required: older releases hardcode compileSdk 34 in their own
  # android/build.gradle and fail AAR metadata checks against AGP 9 / SDK 36.
  file_picker: ^13.1.0

  # Web search (multi-engine meta search: DDG/Google/Bing/Brave/…)

  # Hidden WebView (offscreen) for search-result extraction; on Linux it uses
  # the system WebKitGTK 4.1 (needs libwebkit2gtk-4.1-dev at build time).
  webview_all: ^1.4.4

  # Desktop window sizing (per-user persisted size, applied on next launch)
  window_manager: ^0.5.2

  # Markdown rendering
  markdown_widget: ^2.3.2+6
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Trimmed models.dev snapshot: offline fallback for the provider/model
  # wizard and one-click sync (see DESIGN.md §17).
  assets:
    - assets/models_dev/models_dev.json
    # Bundled page-extraction scripts (host → JS parser), loaded at startup and
    # merged with <root>/scripts/*.json (see DESIGN.md §19).
    - assets/scripts/
    # 应用图标（侧边栏品牌标记）：桌面端用它设置窗口/任务栏图标。
    - assets/icons/app_icon.png

  # Bundled open-source fonts so typography is identical on every platform
  # (Android / iOS / macOS / Windows / Linux) instead of falling back to each
  # system's default CJK font.
  #   - Noto Sans SC  (思源黑体简体, SIL OFL-1.1)  -> UI text
  #   - JetBrains Mono (SIL OFL-1.1)               -> code / monospace
  # Files are subset to the full CJK repertoire (basic + ext-A) to cut size.
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC/NotoSansSC-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
