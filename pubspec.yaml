name: xchat
description: "XChat - LLM Agent cross-platform GUI with H5 + WebView."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  webview_all: ^1.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  crypto: ^3.0.5
  http: ^1.2.2
  shared_preferences: ^2.3.2
  xml: ^7.0.1
  intl: ^0.20.3
  uuid: ^4.5.1
  process_run: ^1.2.1
  file: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/index.html
    - assets/web/css/
    - assets/web/js/
    - assets/web/js/pages/
