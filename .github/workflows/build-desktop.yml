name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: xchat-linux-x64
          - os: windows-latest
            artifact: xchat-windows-x64
          - os: macos-latest
            artifact: xchat-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Enable desktop platforms
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop

      - name: Ensure windows/macos platform dirs exist
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.xchat .
          fi
          if [ ! -d macos ]; then
            flutter create --platforms=macos --org com.xchat .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --release

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: flutter build macos --release --no-codesign

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/${{ matrix.artifact }}.tar.gz bundle

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a ../../../../dist/${{ matrix.artifact }}.zip .

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          tar -C build/macos/Build/Products/Release -czf dist/${{ matrix.artifact }}.tar.gz xchat.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14