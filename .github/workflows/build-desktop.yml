name: Build Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: xchat-linux-x64
          - os: windows-latest
            artifact: xchat-windows-x64
          - os: macos-latest
            artifact: xchat-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="dev"
          fi
          VERSION_NUMBER="1"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION_NAME (build $VERSION_NUMBER)"

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libwebkit2gtk-4.1-dev libsecret-1-dev libnotify-dev

      - name: Enable desktop platforms
        run: |
          flutter config --enable-linux-desktop
          flutter config --enable-windows-desktop
          flutter config --enable-macos-desktop

      - name: Ensure windows/macos platform dirs exist
        shell: bash
        run: |
          if [ ! -d windows ]; then
            flutter create --platforms=windows --org com.xchat .
          fi
          if [ ! -d macos ]; then
            flutter create --platforms=macos --org com.xchat .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        if: matrix.os == 'ubuntu-latest'
        run: flutter build linux --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.number }}

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.number }}
        env:
          CPPFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          CFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

      - name: Build macOS
        if: matrix.os == 'macos-latest'
        run: flutter build macos --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.number }}

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release -czf dist/${{ matrix.artifact }}-${{ steps.version.outputs.name }}.tar.gz bundle

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cd build/windows/x64/runner/Release
          7z a "${GITHUB_WORKSPACE}/dist/${{ matrix.artifact }}-${{ steps.version.outputs.name }}.zip" "."

      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          tar -C build/macos/Build/Products/Release -czf dist/${{ matrix.artifact }}-${{ steps.version.outputs.name }}.tar.gz xchat.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ steps.version.outputs.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14