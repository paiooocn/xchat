name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Package (zip)
        shell: pwsh
        run: |
          $dest = "xchat-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $dest
          echo "ARTIFACT_PATH=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xchat-windows-x64
          path: xchat-windows-x64.zip
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: xchat-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to GitCode release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_ACCESS_KEY }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER || 'yimopub' }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO || 'xchat' }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NAME: XChat ${{ github.ref_name }}
          RELEASE_BODY: Automated release ${{ github.ref_name }}
        run: bash dist/gitcode_release.sh xchat-windows-x64.zip
