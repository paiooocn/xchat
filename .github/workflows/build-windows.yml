name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gitcode_tag:
        description: '手动发布到 GitCode Release 的 tag（如 v0.1.10），留空则不发布'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch bundled Python 3.12
        shell: bash
        run: bash tool/fetch_python.sh

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows (Release) + package (含改名版)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File dist/build_windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xchat-windows-x64
          path: |
            dist/xchat-windows-*.zip
            dist/sixchat-windows-*.zip
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xchat-windows-*.zip
            dist/sixchat-windows-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to GitCode release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gitcode_tag != ''
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_ACCESS_KEY }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER || 'yimopub' }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO || 'xchat' }}
          TAG_NAME: ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_NAME: XChat ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_BODY: Automated release ${{ inputs.gitcode_tag || github.ref_name }}
        run: bash dist/gitcode_release.sh dist/xchat-windows-*.zip dist/sixchat-windows-*.zip
