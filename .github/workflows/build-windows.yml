name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gitcode_tag:
        description: '手动发布到 GitCode Release 的 tag（如 v0.1.10），留空则不发布'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install uv
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch bundled Python 3.12
        shell: bash
        run: bash tool/fetch_python.sh

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Bundle Python runtime
        shell: pwsh
        run: |
          $ver = (Get-Content 'tool\python_version.txt' -Raw).Trim()
          $src = Get-ChildItem -Path 'third_party\python' -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "cpython-$ver-*" } | Select-Object -First 1
          if (-not $src) { throw "bundled python cpython-$ver-* not found (run tool/fetch_python.sh)" }
          $dest = 'build\windows\x64\runner\Release\runtime\python'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path (Join-Path $src.FullName '*') -Destination $dest -Recurse -Force
          # Windows 发行版只带 python.exe，Agent 统一写 `python3 xxx.py`：补一个同名别名。
          $exe = Join-Path $dest 'python.exe'
          $exe3 = Join-Path $dest 'python3.exe'
          if ((Test-Path $exe) -and -not (Test-Path $exe3)) {
            Copy-Item -Path $exe -Destination $exe3 -Force
            Write-Host '==> 已生成别名 python3.exe'
          }
          Write-Host "==> bundled python: $($src.FullName)"

      - name: Package (zip)
        shell: pwsh
        run: |
          $ver = ((Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim().Split('+')[0])
          $dest = "xchat-windows-x64-v$ver.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $dest
          echo "PKG_NAME=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xchat-windows-x64
          path: ${{ env.PKG_NAME }}
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PKG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to GitCode release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gitcode_tag != ''
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_ACCESS_KEY }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER || 'yimopub' }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO || 'xchat' }}
          TAG_NAME: ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_NAME: XChat ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_BODY: Automated release ${{ inputs.gitcode_tag || github.ref_name }}
        run: bash dist/gitcode_release.sh "${{ env.PKG_NAME }}"
