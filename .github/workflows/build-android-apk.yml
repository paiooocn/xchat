name: Build Android (apk)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gitcode_tag:
        description: '手动发布到 GitCode Release 的 tag（如 v0.1.10），留空则不发布'
        required: false
        default: ''

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: bash dist/build_apk.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xchat-android-apk
          path: |
            dist/xchat-v*.apk
            dist/sixchat-v*.apk
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/xchat-v*.apk
            dist/sixchat-v*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tag 推送时的 GitCode 发布交给唯一的串行发布者（publish-gitcode.yml），
      # 这里只保留「手动填 gitcode_tag」的单路发布入口。
      - name: Attach to GitCode release (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.gitcode_tag != ''
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_ACCESS_KEY }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER || 'yimopub' }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO || 'xchat' }}
          TAG_NAME: ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_NAME: XChat ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_BODY: Automated release ${{ inputs.gitcode_tag || github.ref_name }}
        run: |
          # 整脚本重跑 3 轮：脚本幂等（已上传的附件会被跳过），
          # 用于兜住进程内重试救不回来的抖动（release 创建竞态、token 瞬时失效等）
          for round in 1 2 3; do
            if bash dist/gitcode_release.sh dist/xchat-v*.apk dist/sixchat-v*.apk; then
              exit 0
            fi
            if [ "$round" -lt 3 ]; then
              echo "!! 第 ${round} 轮 GitCode 发布未完成，30s 后整脚本重跑"
              sleep 30
            fi
          done
          echo "!! GitCode 发布连续 3 轮未完成"
          exit 1
