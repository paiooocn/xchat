name: Build Linux (deb)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gitcode_tag:
        description: '手动发布到 GitCode Release 的 tag（如 v0.1.10），留空则不发布'
        required: false
        default: ''

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Linux + package deb
        run: bash dist/build_deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xchat-linux-deb
          path: dist/xchat-v*.deb
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xchat-v*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to GitCode release (on tag)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gitcode_tag != ''
        shell: bash
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_ACCESS_KEY }}
          GITCODE_OWNER: ${{ vars.GITCODE_OWNER || 'yimopub' }}
          GITCODE_REPO: ${{ vars.GITCODE_REPO || 'xchat' }}
          TAG_NAME: ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_NAME: XChat ${{ inputs.gitcode_tag || github.ref_name }}
          RELEASE_BODY: Automated release ${{ inputs.gitcode_tag || github.ref_name }}
        run: bash dist/gitcode_release.sh dist/xchat-v*.deb
